<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YamaZina Studio</title>
<style>
  :root { --paper:#faf9f5; --panel:#efece5; --ink:#23231f; --ink60:rgba(35,35,31,0.6);
          --ink30:rgba(35,35,31,0.3); --ink16:rgba(35,35,31,0.16); --accent:#8a5a2b; }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; height:100%; background:var(--paper); color:var(--ink);
    font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace; }
  body { display:flex; }

  #rail { width:232px; flex:0 0 232px; background:var(--panel); border-right:1px solid var(--ink16);
    display:flex; flex-direction:column; overflow-y:auto; }
  #rail .head { padding:20px 16px 14px; border-bottom:1px solid var(--ink16); }
  #rail .kicker { font:600 8.5px/1 inherit; letter-spacing:0.18em; color:var(--accent); text-transform:uppercase; }
  #rail h1 { font:600 16px/1.2 Archivo,Helvetica,Arial,sans-serif; margin:8px 0 0; }
  #rail .proj { padding:14px 16px 6px; }
  #rail .proj .pname { font:600 9px/1 inherit; letter-spacing:0.16em; color:var(--ink60);
    text-transform:uppercase; margin-bottom:8px; }
  #rail button { display:block; width:100%; text-align:left; margin:0 0 6px; padding:9px 11px;
    border:1px solid var(--ink16); background:#fbfaf7; color:var(--ink); cursor:pointer;
    font:500 10.5px/1.3 inherit; border-radius:2px; }
  #rail button:hover { border-color:var(--accent); }
  #rail button.on { background:var(--ink); color:#fbfaf7; border-color:var(--ink); }
  #rail button .d { display:block; font-size:8.5px; color:var(--ink60); margin-top:3px; }
  #rail button.on .d { color:rgba(251,250,247,0.65); }
  #rail .foot { margin-top:auto; padding:14px 16px 18px; font-size:8.5px; line-height:1.7;
    color:var(--ink60); border-top:1px solid var(--ink16); }

  #stage { flex:1 1 auto; display:flex; min-width:0; }
  #stage iframe { border:0; flex:1 1 50%; min-width:0; height:100vh; background:var(--paper); }
  #stage iframe + iframe { border-left:1px solid var(--ink16); }
</style>
</head>
<body>
<div id="rail">
  <div class="head">
    <div class="kicker">YamaZina Studio</div>
    <h1>Projects</h1>
  </div>

  <div class="proj">
    <div class="pname">01 · Sauna — Mark 5</div>
    <button data-view="apps/sauna/index.html"><b>3D Build</b><span class="d">full parametric model · budget · versions</span></button>
    <button data-view="apps/sauna/plan.html"><b>2D Plan</b><span class="d">measured plan + elevation sheet</span></button>
    <button data-view="apps/sauna/plan.html|apps/sauna/index.html"><b>2D + 3D side by side</b><span class="d">edit left, watch it land right — live</span></button>
  </div>

  <div class="proj">
    <div class="pname">02 · Bathroom</div>
    <button data-view="apps/bathroom/planner.html"><b>Elevation Planner</b><span class="d">2D shell · fittings · materials · lock versions</span></button>
    <button data-view="apps/bathroom/3d.html"><b>3D Model</b><span class="d">locked layout · OBJ/GLB export</span></button>
    <button data-view="apps/bathroom/lookbook.html"><b>Look Book</b><span class="d">59 material cutouts + hardware icons</span></button>
    <button data-view="apps/bathroom/fixtures.html"><b>Fixture Options</b><span class="d">41-option combo picker</span></button>
    <button data-view="apps/bathroom/planner.html|apps/bathroom/3d.html"><b>2D + 3D side by side</b><span class="d">edit left, 3D follows live — no locking</span></button>
  </div>

  <div class="proj">
    <div class="pname">03 · Shower Enclosure</div>
    <button data-view="apps/shower/index.html"><b>3D Construct</b><span class="d">51½″ × 48″ · fixtures · tile schedule · spec sheet</span></button>
  </div>

  <div class="foot">
    One design state per project, shared by its views through the platform store.
    Switch freely — nothing here reloads your work.
  </div>
</div>

<div id="stage"></div>

<script>
(function () {
  'use strict';
  var stage = document.getElementById('stage');
  var buttons = Array.prototype.slice.call(document.querySelectorAll('#rail button'));

  function show(view, btn) {
    // view = one page, or "left|right" for a split. Iframes are same-origin, so
    // every pane shares localStorage — the platform store's storage events give
    // the sauna split its live 2D->3D sync with no extra wiring.
    stage.innerHTML = '';
    view.split('|').forEach(function (src) {
      var f = document.createElement('iframe');
      f.src = src;
      f.title = src;
      stage.appendChild(f);
    });
    buttons.forEach(function (b) { b.classList.toggle('on', b === btn); });
    try { history.replaceState(null, '', '#' + encodeURIComponent(view)); } catch (e) { /* file:// */ }
  }

  buttons.forEach(function (b) {
    b.addEventListener('click', function () { show(b.getAttribute('data-view'), b); });
  });

  // deep link: studio.html#apps/sauna/plan.html (or a "a|b" split)
  var initial = decodeURIComponent((location.hash || '').slice(1));
  var match = buttons.filter(function (b) { return b.getAttribute('data-view') === initial; })[0];
  if (match) { show(initial, match); }
  else { show(buttons[0].getAttribute('data-view'), buttons[0]); }
})();
</script>
</body>
</html>
