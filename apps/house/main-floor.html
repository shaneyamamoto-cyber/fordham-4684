<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fordham 4684 — Main Floor 3D (AR/AI map)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#0e141b;--panel:#141d27;--line:#26333f;--ink:#e7edf3;--soft:#93a1b0;--accent:#4aa8c4;}
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
  #app{position:fixed;inset:0} canvas{display:block}
  .hud{position:fixed;z-index:10}
  #title{top:14px;left:16px;pointer-events:none}
  #title h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.02em}
  #title p{margin:2px 0 0;font-size:11.5px;color:var(--soft)}
  #views{top:12px;right:14px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:64vw}
  button{font:inherit;font-size:12px;color:var(--ink);background:var(--panel);border:1px solid var(--line);
    border-radius:7px;padding:6px 11px;cursor:pointer} button:hover{border-color:var(--accent)}
  #views button.on{background:var(--accent);border-color:var(--accent);color:#04222b;font-weight:600}
  #panel{bottom:14px;left:16px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px 15px;min-width:236px}
  #panel h2{margin:0 0 9px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--soft)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0;font-size:12.5px}
  .row input[type=range]{flex:1;accent-color:var(--accent)}
  .row .val{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600;min-width:46px;text-align:right}
  .toggles{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .toggles button.on{color:var(--ink);border-color:var(--accent);background:#12212b}
  #exports{bottom:14px;right:16px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px 14px}
  #exports h2{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--soft)}
  #exports .er{display:flex;gap:6px}
  #exports button{background:#12212b;border-color:var(--accent)}
  #hint{position:fixed;bottom:96px;right:16px;font-size:11px;color:var(--soft);text-align:right;pointer-events:none}
  #msg{position:fixed;top:52px;left:16px;font-size:12px;color:var(--accent)}
</style>
</head>
<body>
<div id="app"></div>
<div class="hud" id="title"><h1>Main Floor — 3D Model</h1>
  <p>Fordham 4684 · scale-accurate from the permit scan · metric (m) · 8&prime; ceilings</p></div>
<div class="hud" id="msg"></div>
<div class="hud" id="views">
  <button data-v="iso" class="on">Iso</button><button data-v="top">Top (map)</button>
  <button data-v="front">Front</button><button data-v="bath">Bath/Office</button><button data-v="living">Living</button>
</div>
<div class="hud" id="panel"><h2>Model</h2>
  <div class="row"><label>Ceiling</label><input id="ceil" type="range" min="7" max="12" step="0.5" value="8">
    <span class="val" id="cv">8&prime;0&Prime;</span></div>
  <div class="toggles" id="tg">
    <button data-t="furn">Fixtures</button><button data-t="roof">Ceiling</button>
    <button data-t="glass" class="on">Glass</button><button data-t="labels" class="on">Labels</button>
    <button data-t="grid" class="on">Grid</button></div>
</div>
<div class="hud" id="exports"><h2>Export for AR / AI</h2>
  <div class="er"><button id="eglb">GLB</button><button id="eobj">OBJ</button><button id="ejson">plan JSON</button></div>
</div>
<div class="hud" id="hint">drag: orbit · scroll: zoom · right-drag: pan</div>

<script src="floor-data.js"></script>
<script type="importmap">
{ "imports": {
  "three": "../../platform/vendor/three-0.184/three.module.js",
  "three/addons/": "../../platform/vendor/three-0.184/addons/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/OrbitControls.js';
import { GLTFExporter } from 'three/addons/GLTFExporter.js';
import { OBJExporter } from 'three/addons/OBJExporter.js';

const F = window.FLOOR, M = F.FT_M;           // build in METRES for AR correctness
let CEIL = F.ceiling;
const state = { furn:false, roof:false, glass:true, labels:true, grid:true };

const app=document.getElementById('app');
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x0e141b);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.05,500);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.08;

scene.add(new THREE.HemisphereLight(0xdfe8f2,0x2a2620,0.9));
const sun=new THREE.DirectionalLight(0xfff2dc,1.1); sun.position.set(-12,22,9); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); Object.assign(sun.shadow.camera,{left:-22,right:22,top:22,bottom:-22,near:0.5,far:90});
scene.add(sun);
const fill=new THREE.DirectionalLight(0xbcd2e6,0.35); fill.position.set(15,12,-9); scene.add(fill);

const matWall =new THREE.MeshStandardMaterial({color:0xcabfa6,roughness:.92,side:THREE.DoubleSide});
const matExt  =new THREE.MeshStandardMaterial({color:0xbdb199,roughness:.95,side:THREE.DoubleSide});
const matGlass=new THREE.MeshPhysicalMaterial({color:0x9fd0e6,roughness:.05,transmission:.85,transparent:true,opacity:.5,thickness:.02,ior:1.4,side:THREE.DoubleSide});
const matFrame=new THREE.MeshStandardMaterial({color:0x3f4750,roughness:.5,metalness:.3});
const matRoof =new THREE.MeshStandardMaterial({color:0xd8d2c6,roughness:.95,side:THREE.DoubleSide,transparent:true,opacity:.85});
const matPorch=new THREE.MeshStandardMaterial({color:0x9c8f78,roughness:.9});
const ROOMCOL={room:0xd9d2c4,circ:0xd0d5db,stair:0xccd2c8,bath:0xcfe0da,util:0xe6efe9,garage:0xcccfc9,closet:0xdcd6c8,porch:0xb9ad95};

const G={walls:new THREE.Group(),glass:new THREE.Group(),frame:new THREE.Group(),
  roof:new THREE.Group(),floor:new THREE.Group(),labels:new THREE.Group(),grid:new THREE.Group(),
  export:new THREE.Group()}; // export = walls+floor merged group we hand to exporters
Object.values(G).forEach(g=>scene.add(g));

/* ---- build a wall (Shape with holes) in metres ---- */
function buildWall(w){
  const [ax,az]=w.a,[bx,bz]=w.b, dx=bx-ax,dz=bz-az, len=Math.hypot(dx,dz)*M, ang=Math.atan2(dz,dx);
  const h=CEIL*M, t=(w.ext?0.66:0.42)*M;
  const shp=new THREE.Shape();
  shp.moveTo(0,0); shp.lineTo(len,0); shp.lineTo(len,h); shp.lineTo(0,h); shp.lineTo(0,0);
  w.ops.forEach(o=>{
    const s=o.s*M,e=o.e*M; let y0,y1;
    if(o.kind==='win'){ y1=Math.min(2.05, h-0.1); y0=Math.max(0.15,y1-o.h*M); }
    else { y0=0; y1=Math.min(o.h*M, h-0.05); }
    const p=new THREE.Path(); p.moveTo(s,y0);p.lineTo(e,y0);p.lineTo(e,y1);p.lineTo(s,y1);p.lineTo(s,y0);
    shp.holes.push(p);
    if(o.kind==='win'){ const g=new THREE.Mesh(new THREE.BoxGeometry(e-s,y1-y0,0.03),matGlass);
      posOn(g,ax,az,ang,(s+e)/2,(y0+y1)/2); G.glass.add(g); }
    const fr=frame(e-s,y1-y0,o.kind!=='win'); posOn(fr,ax,az,ang,(s+e)/2,(y0+y1)/2); G.frame.add(fr);
  });
  const geo=new THREE.ExtrudeGeometry(shp,{depth:t,bevelEnabled:false,curveSegments:1});
  geo.translate(0,0,-t/2);
  const m=new THREE.Mesh(geo,w.ext?matExt:matWall); m.rotation.y=-ang; m.position.set(ax*M,0,az*M);
  m.castShadow=true; m.receiveShadow=true; G.walls.add(m);
}
function posOn(mesh,ax,az,ang,localX,localY){
  mesh.position.set(ax*M+Math.cos(ang)*localX, localY, az*M+Math.sin(ang)*localX); mesh.rotation.y=-ang;
}
function frame(w,h,isDoor){ const g=new THREE.Group(),t=0.05,d=0.5*M;
  const bar=(bw,bh,x,y)=>{const b=new THREE.Mesh(new THREE.BoxGeometry(bw,bh,d),matFrame);b.position.set(x,y,0);g.add(b);};
  bar(w+t,t,0,h/2); bar(t,h,-w/2,0); bar(t,h,w/2,0); if(!isDoor) bar(w+t,t,0,-h/2); return g; }

/* ---- floors + porch + ceiling ---- */
function buildFloors(){
  F.ROOMS.forEach((r,i)=>{ const [x0,z0,x1,z1,,use]=r;
    if(use==='porch') return;
    const g=new THREE.Mesh(new THREE.PlaneGeometry((x1-x0)*M,(z1-z0)*M),
      new THREE.MeshStandardMaterial({color:ROOMCOL[use]||0xd9d2c4,roughness:.85}));
    g.rotation.x=-Math.PI/2; g.position.set((x0+x1)/2*M,0.005+i*0.001,(z0+z1)/2*M); g.receiveShadow=true; G.floor.add(g);
  });
  const p=F.porch, pg=new THREE.Mesh(new THREE.PlaneGeometry((p[2]-p[0])*M,(p[3]-p[1])*M),matPorch);
  pg.rotation.x=-Math.PI/2; pg.position.set((p[0]+p[2])/2*M,-0.1*M,(p[1]+p[3])/2*M); pg.receiveShadow=true; G.floor.add(pg);
}
function buildPorch(){ const p=F.porch, w=(p[2]-p[0])*M,d=(p[3]-p[1])*M,h=CEIL*M;
  const roof=new THREE.Mesh(new THREE.BoxGeometry(w+0.3,0.12,d+0.15),matRoof);
  roof.position.set((p[0]+p[2])/2*M,h,(p[1]+p[3])/2*M); G.roof.add(roof);
  [[p[0],p[3]],[p[2],p[3]],[(p[0]+p[2])/2,p[3]]].forEach(c=>{
    const col=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,h,14),matPorch);
    col.position.set(c[0]*M,h/2,c[1]*M); col.castShadow=true; G.roof.add(col); });
}
function buildCeiling(){ F.ROOMS.forEach(r=>{ const[x0,z0,x1,z1,,use]=r; if(use==='porch')return;
  const c=new THREE.Mesh(new THREE.PlaneGeometry((x1-x0)*M,(z1-z0)*M),matRoof);
  c.rotation.x=Math.PI/2; c.position.set((x0+x1)/2*M,CEIL*M,(z0+z1)/2*M); G.roof.add(c); }); }

/* ---- labels ---- */
function label(text,x,z){ const cv=document.createElement('canvas'); cv.width=512; cv.height=128;
  const ctx=cv.getContext('2d'); ctx.fillStyle='rgba(10,16,22,.5)'; ctx.fillRect(0,0,512,128);
  ctx.font='bold 58px system-ui'; ctx.fillStyle='#eaf1f6'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(text,256,64); const tx=new THREE.CanvasTexture(cv); tx.colorSpace=THREE.SRGBColorSpace;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tx,transparent:true,depthTest:false}));
  const sc=Math.min(3.2, Math.max(1.6, text.length*0.22)); sp.scale.set(sc,sc/4,1);
  sp.position.set(x*M,CEIL*M*0.5+0.4,z*M); G.labels.add(sp); }
function buildLabels(){ F.ROOMS.forEach(r=>{ if(r[5]==='closet')return; label(r[4],(r[0]+r[2])/2,(r[1]+r[3])/2); }); }

function buildGrid(){ const b=F.bounds, w=(b.x1-b.x0), d=(b.z1-b.z0), n=Math.ceil(Math.max(w,d));
  const g=new THREE.GridHelper(n*M, n, 0x2a3a49, 0x1b2733); g.position.set((b.x0+b.x1)/2*M,0,(b.z0+b.z1)/2*M); G.grid.add(g); }

function clear(g){ while(g.children.length) g.remove(g.children[0]); }
function rebuild(){ clear(G.walls);clear(G.glass);clear(G.frame);clear(G.roof);
  F.WALLS.forEach(buildWall); buildPorch(); if(state.roof) buildCeiling();
  G.glass.visible=state.glass; G.labels.children.forEach(s=>s.position.y=CEIL*M*0.5+0.4); }
buildFloors(); buildLabels(); buildGrid(); rebuild();
G.labels.visible=state.labels; G.grid.visible=state.grid;

/* ---- camera views ---- */
const b=F.bounds, cx=(b.x0+b.x1)/2*M, cz=(b.z0+b.z1)/2*M;
function set(px,py,pz,tx,ty,tz){ camera.position.set(px,py,pz); controls.target.set(tx,ty,tz); controls.update(); }
const VIEWS={
  iso:  ()=>set(cx-16, 20, cz+20, cx, 1, cz-2),
  top:  ()=>set(cx+0.01, 34, cz, cx, 0, cz),
  front:()=>set(cx, 7, cz+26, cx, 1.4, cz),
  bath: ()=>set(54*M-4, 6, 8*M+8, 51*M, 1.2, 10*M),
  living:()=>set(6*M, 6, 12*M+10, 17*M, 1.2, 12*M),
};
function go(v){ camera.up.set(v==='top'?0:0, v==='top'?0:1, v==='top'?-1:0); (VIEWS[v]||VIEWS.iso)();
  document.querySelectorAll('#views button').forEach(x=>x.classList.toggle('on',x.dataset.v===v)); }
go('iso');

/* ---- UI ---- */
document.querySelectorAll('#views button').forEach(x=>x.onclick=()=>go(x.dataset.v));
const ceil=document.getElementById('ceil'), cv=document.getElementById('cv');
const fmt=v=>`${Math.floor(v)}&prime;${Math.round((v-Math.floor(v))*12)}&Prime;`;
ceil.oninput=()=>{ CEIL=parseFloat(ceil.value); cv.innerHTML=fmt(CEIL); rebuild(); };
document.querySelectorAll('#tg button').forEach(btn=>btn.onclick=()=>{ const t=btn.dataset.t; state[t]=!state[t];
  btn.classList.toggle('on',state[t]);
  if(t==='glass')G.glass.visible=state.glass; else if(t==='labels')G.labels.visible=state.labels;
  else if(t==='grid')G.grid.visible=state.grid; else if(t==='roof')rebuild(); else if(t==='furn'){} });

/* ---- EXPORTS for AR / AI ---- */
const msg=document.getElementById('msg'); let msgT;
function flash(s){ msg.textContent=s; clearTimeout(msgT); msgT=setTimeout(()=>msg.textContent='',3500); }
function dl(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); }
function exportGroup(){ const g=new THREE.Group();
  G.walls.children.forEach(m=>g.add(m.clone())); G.floor.children.forEach(m=>g.add(m.clone()));
  G.glass.children.forEach(m=>g.add(m.clone())); return g; }
document.getElementById('eglb').onclick=()=>{ new GLTFExporter().parse(exportGroup(),
  r=>{ dl(new Blob([r],{type:'model/gltf-binary'}),'fordham4684-mainfloor.glb'); flash('GLB exported (metres, +Y up) — AR ready'); },
  e=>flash('GLB error: '+e), {binary:true}); };
document.getElementById('eobj').onclick=()=>{ const s=new OBJExporter().parse(exportGroup());
  dl(new Blob([s],{type:'text/plain'}),'fordham4684-mainfloor.obj'); flash('OBJ exported (metres)'); };
document.getElementById('ejson').onclick=()=>{ dl(new Blob([JSON.stringify(planJSON(),null,2)],{type:'application/json'}),'fordham4684-mainfloor.plan.json'); flash('plan JSON exported (m + ft)'); };
function planJSON(){ return {
  project:"Fordham 4684", floor:"main", generated_from:"permit scan @22.6px/ft",
  units:{length:"meters", also:"feet"}, up:"+Y", origin:"NW corner", ceiling_m:+(CEIL*M).toFixed(3), ceiling_ft:CEIL,
  bounds_m:{x0:0,z0:0,x1:+(F.bounds.x1*M).toFixed(3),z1:+(F.bounds.z1*M).toFixed(3)},
  rooms:F.ROOMS.map(r=>({name:r[4],use:r[5],
    x0_m:+(r[0]*M).toFixed(3),z0_m:+(r[1]*M).toFixed(3),x1_m:+(r[2]*M).toFixed(3),z1_m:+(r[3]*M).toFixed(3),
    x0_ft:r[0],z0_ft:r[1],x1_ft:r[2],z1_ft:r[3]})),
  walls:F.WALLS.map(w=>({a_m:[+(w.a[0]*M).toFixed(3),+(w.a[1]*M).toFixed(3)],b_m:[+(w.b[0]*M).toFixed(3),+(w.b[1]*M).toFixed(3)],
    a_ft:w.a,b_ft:w.b,exterior:w.ext,thickness_m:+((w.ext?0.66:0.42)*M).toFixed(3),
    openings:w.ops.map(o=>({kind:o.kind,start_ft:o.s,end_ft:o.e,height_ft:o.h||(o.kind==='door'?6.667:6)}))})),
}; }
window.__planJSON=planJSON; window.__exportGroup=exportGroup; window.THREE=THREE; window.GLTFExporter=GLTFExporter;

addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
(function loop(){ requestAnimationFrame(loop); controls.update(); renderer.render(scene,camera); })();
</script>
</body>
</html>
