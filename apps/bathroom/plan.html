<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bathroom — 2D Floor Plan</title>
<style>
  :root { --paper:#faf9f5; --panel:#efece5; --ink:#23231f; --ink60:rgba(35,35,31,0.6);
          --ink16:rgba(35,35,31,0.16); --accent:#8a5a2b; }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; background:var(--paper); color:var(--ink);
    font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace; }
  #bar { padding:18px 24px 10px; }
  .kicker { font:600 10px/1 inherit; letter-spacing:0.18em; color:var(--accent); text-transform:uppercase; }
  h1 { font:600 20px/1.2 Archivo,Helvetica,Arial,sans-serif; margin:8px 0 2px; }
  .sub { font-size:10px; color:var(--ink60); }
  #sheet { padding:10px 24px 40px; overflow:auto; position:relative; }
  svg text { font-family:inherit; }
  .tag { font:600 8px/1 inherit; letter-spacing:0.08em; fill:var(--ink60); text-transform:uppercase; }
  .dim { font:500 9px/1 inherit; fill:var(--ink60); }
  rect.fit { cursor:pointer; }
  rect.fit:hover { stroke-width:2; }
  rect.fit.lock { cursor:not-allowed; }

  #pop { position:absolute; display:none; z-index:40; background:#fbfaf7; border:1px solid #23231f;
    border-radius:2px; box-shadow:0 8px 26px rgba(0,0,0,0.2); padding:12px 13px 13px; width:216px; }
  #pop .pt { font:600 10px/1 inherit; letter-spacing:0.1em; text-transform:uppercase; margin-bottom:9px; }
  #pop .fr { display:flex; align-items:center; gap:8px; margin-bottom:7px; }
  #pop label { flex:0 0 92px; font-size:9px; color:var(--ink60); }
  #pop input { flex:1; width:60px; font:inherit; font-size:10px; padding:4px 5px;
    border:1px solid rgba(35,35,31,0.3); border-radius:2px; background:#fff; }
  #pop .btns { display:flex; gap:6px; margin-top:9px; }
  #pop button { flex:1; font:600 9px/1 inherit; letter-spacing:0.1em; padding:7px 0; cursor:pointer;
    border:1px solid #23231f; border-radius:2px; background:#23231f; color:#fbfaf7; }
  #pop button.ghost { background:transparent; color:#23231f; }
  #flash { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:50; display:none;
    background:#23231f; color:#fbfaf7; padding:11px 17px; border-radius:2px;
    font:600 10px/1.4 inherit; letter-spacing:0.1em; }
</style>
</head>
<body>
<div id="bar">
  <div class="kicker">Measured Layout Tool · House Plan Set</div>
  <h1>Bathroom — Floor Plan</h1>
  <div class="sub" id="src">baseline plan · click an unlocked fitting to edit its footprint — locked pieces refuse</div>
</div>
<div id="sheet">
  <div id="pop">
    <div class="pt" id="popTitle"></div>
    <div class="fr"><label>Along wall — x ″</label><input id="popX" type="number" step="0.25"></div>
    <div class="fr"><label>Width — w ″</label><input id="popW" type="number" step="0.25"></div>
    <div class="fr" id="popDepRow"><label>Depth — dep ″</label><input id="popDep" type="number" step="0.25"></div>
    <div class="btns">
      <button id="popSave" type="button">SAVE</button>
      <button id="popCancel" type="button" class="ghost">CANCEL</button>
    </div>
  </div>
</div>
<div id="flash"></div>

<script src="../../platform/core/store.js"></script>
<script>
(function () {
  'use strict';
  window.PlatformStore('bathroom');
  var WORK_KEY = 'yamazina.bathroom.work.v1';

  // Baseline mirrors the built-in plan (bathroom_7 measures); the planner's
  // working state supersedes it the moment one exists.
  var SHELL = [{x:0,d:14.5},{x:60.5,d:14.5},{x:60.5,d:0},{x:169,d:0},{x:169,d:-56.5},{x:0,d:-56.5}];
  var BASE_ITEMS = [
    {id:'tub',name:'Tub',x:0,w:32,dep:60,face:14.5,locked:true},
    {id:'tower',name:'Storage tower',x:44.5,w:16,dep:14.5,face:14.5},
    {id:'shelf',name:'Shelves',x:32,w:12,dep:18,face:14.5},
    {id:'wet',name:'Shower zone',x:0,w:32,dep:60,face:14.5,zone:true},
    {id:'van',name:'Vanity',x:66.25,w:36,dep:12,face:0,locked:true},
    {id:'vessel',name:'Basin',x:67.75,w:22,dep:13.8,face:0},
    {id:'stone',name:'Landing',x:91.5,w:10,dep:13.8,face:0},
    {id:'splash',name:'Splash',x:61.25,w:46,dep:0.5,face:0},
    {id:'door',name:'Door 30″',x:110.5,w:30,dep:1,face:0,door:true},
    {id:'wc',name:'WC',x:169,w:16,dep:26,face:0,wall:'end',d:26.75,flip:true},
  ];

  var live = false;
  function loadState() {
    try {
      var w = JSON.parse(localStorage.getItem(WORK_KEY) || 'null');
      if (w && w.items && w.items.length) {
        live = true;
        document.getElementById('src').textContent =
          'working design — live with the Elevation Planner and 3D · click an unlocked fitting to edit';
        return { items: w.items, poly: w.poly || SHELL, raw: w };
      }
    } catch (e) { /* fall through to baseline */ }
    live = false;
    return { items: BASE_ITEMS, poly: SHELL, raw: null };
  }

  // plan footprint of an item, in plan inches {x0, d0, w, dp} — d measured
  // toward the dormer (negative side); face 14.5 = bay-side fittings
  function footprint(it) {
    var dep = it.dep || 1;
    if (it.wall === 'end') {
      var dTop = 14.5 - (it.d || 0);
      return { x0: it.flip ? it.x - dep : it.x, w: dep, d1: dTop, dp: it.w };
    }
    if (it.wall === 'slope') {
      // dormer-wall pieces (towel bars) — small tick at the bottom edge
      return { x0: it.x, w: it.w, d1: -56.5 + (it.dep || 4), dp: it.dep || 4 };
    }
    var base = (it.face || 0) > 0 ? 14.5 : 0;
    return { x0: it.x, w: it.w, d1: base, dp: dep };
  }
  function isPlanItem(it) {
    if (it.wall === 'slope') return true;
    if (it.h && !it.dep) return false;              // wall-only graphics
    if (it.y != null && it.y > 40 && !it.zone) return false; // mirrors, lights, rails
    return true;
  }

  var SC = 6.2, M = 60, TOP = 34;
  var NS = 'http://www.w3.org/2000/svg';
  var sheet = document.getElementById('sheet');
  var svg = null;

  function render() {
    var st = loadState();
    var xs = st.poly.map(function (p) { return p.x; }), ds = st.poly.map(function (p) { return p.d; });
    var X0 = Math.min.apply(0, xs), X1 = Math.max.apply(0, xs);
    var D0 = Math.min.apply(0, ds), D1 = Math.max.apply(0, ds);
    // plan from above: x right, depth DOWN — bay/vanity wall top, dormer wall bottom
    var px = function (x) { return M + (x - X0) * SC; };
    var pd = function (d) { return M + TOP + (D1 - d) * SC; };
    var W = M * 2 + (X1 - X0) * SC + 120, H = M + TOP + (D1 - D0) * SC + 118;

    if (svg) svg.remove();
    svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('width', W); svg.setAttribute('height', H);
    sheet.appendChild(svg);
    function el(n, a) { var e = document.createElementNS(NS, n); for (var k in a) e.setAttribute(k, a[k]); svg.appendChild(e); return e; }
    function txt(x, y, t, cls, anch) { var e = el('text', { x: x, y: y, 'class': cls || 'dim', 'text-anchor': anch || 'start' }); e.textContent = t; return e; }

    // shell
    el('polygon', { points: st.poly.map(function (p) { return px(p.x) + ',' + pd(p.d); }).join(' '),
      fill: '#fbfaf7', stroke: '#23231f', 'stroke-width': 2 });
    // dormer slope: knee wall at the bottom edge, flat ceiling beyond the 32" run
    el('line', { x1: px(X0), y1: pd(D0 + 32), x2: px(X1), y2: pd(D0 + 32),
      stroke: 'rgba(138,90,43,0.55)', 'stroke-width': 1, 'stroke-dasharray': '6 4' });
    txt(px((X0 + X1) / 2), pd(D0 + 32) + 12, 'DORMER SLOPE — 32″ RUN, FULL LENGTH', 'tag', 'middle');

    // label ledger: fittings get leader lines to two margin rows so text
    // never sits on top of other text
    var topLabels = [], botLabels = [];
    var inlineUsed = {};   // stack coincident inline labels (tub + wet zone)

    st.items.filter(isPlanItem).forEach(function (it) {
      var f = footprint(it);
      var x0 = px(f.x0), y0 = pd(f.d1), w = f.w * SC, h = f.dp * SC;
      var r = el('rect', { x: x0, y: y0, width: Math.max(2, w), height: Math.max(2, h),
        fill: it.zone ? 'none' : (it.door ? '#fff' : (it.locked ? '#e2d8c2' : '#e9e2d2')),
        stroke: it.zone ? 'rgba(61,84,87,0.6)' : '#8a5a2b',
        'stroke-width': it.zone ? 1 : 1.1,
        'stroke-dasharray': it.zone ? '5 4' : 'none',
        'class': 'fit' + (it.locked ? ' lock' : ''), 'data-id': it.id });
      if (it.locked) {
        txt(x0 + w / 2, y0 + h / 2 + 3, '🔒', 'tag', 'middle').setAttribute('font-size', '10');
      }
      var label = (it.name || it.id).toUpperCase() + ' · ' + fmt(f.w) + '×' + fmt(f.dp) + '″';
      var big = w > 84 && h > 26;
      if (big) {
        var key = Math.round(x0) + ':' + Math.round(y0);
        var bump = (inlineUsed[key] || 0);
        inlineUsed[key] = bump + 1;
        txt(x0 + 4, y0 + 12 + bump * 11, label, 'tag');
      } else {
        // route to the nearer ledger row
        var side = (f.d1 > -20) ? topLabels : botLabels;
        side.push({ x: x0 + w / 2, y: side === topLabels ? y0 : y0 + h, label: label, lock: !!it.locked });
      }
      // per-item position dim on the vanity wall pieces
      if (!it.zone && !it.door && f.d1 === 0 && f.dp > 3) {
        txt(x0 + w / 2, y0 + h + 10, 'x ' + fmt(f.x0), 'dim', 'middle');
      }
    });

    function ledger(list, yRow, dirUp) {
      list.sort(function (a, b) { return a.x - b.x; });
      var rowEnd = [-1e9, -1e9], minGap = 26;
      list.forEach(function (L, i) {
        var row = i % 2;                        // alternate two text rows
        var ry = yRow + (dirUp ? -row * 14 : row * 14);
        var lx = Math.max(L.x, rowEnd[row] + minGap);
        rowEnd[row] = lx + L.label.length * 6.4; // reserve the text's width
        el('line', { x1: L.x, y1: L.y, x2: lx, y2: ry + (dirUp ? 5 : -8),
          stroke: 'rgba(35,35,31,0.35)', 'stroke-width': 0.7 });
        txt(lx - 2, ry + (dirUp ? 2 : 2), (L.lock ? '🔒 ' : '') + L.label, 'tag');
      });
    }
    ledger(topLabels, pd(D1) - 24, true);
    ledger(botLabels, pd(D0) + 40, false);

    // overall dims
    var runIn = X1 - X0, depIn = D1 - D0;
    el('line', { x1: px(X0), y1: pd(D0) + 62, x2: px(X1), y2: pd(D0) + 62, stroke: 'rgba(35,35,31,0.45)', 'stroke-width': 0.75 });
    txt((px(X0) + px(X1)) / 2, pd(D0) + 58, ftIn(runIn) + ' RUN', 'dim', 'middle');
    el('line', { x1: px(X1) + 26, y1: pd(D1), x2: px(X1) + 26, y2: pd(D0), stroke: 'rgba(35,35,31,0.45)', 'stroke-width': 0.75 });
    txt(px(X1) + 33, (pd(D1) + pd(D0)) / 2, ftIn(depIn), 'dim');
    txt(px(X0), pd(D0) + 80, 'VANITY / BAY WALL AT TOP · DORMER WALL (TOWEL BARS) AT BOTTOM · SHADED = LOCKED', 'tag');
  }
  function fmt(n) { return Math.round(n * 4) / 4 + ''; }
  function ftIn(n) { return (n / 12 | 0) + '′-' + Math.round(n % 12) + '″'; }

  // ------------------------------------------------------------- editing --
  // The uniform platform rule: click a piece → if it's locked it refuses;
  // if not, the edit window opens. Writes land in the shared work slot, so
  // the Elevation Planner and the 3D pick them up as the working design.
  var pop = document.getElementById('pop');
  var editingId = null;
  function flash(msg) {
    var f = document.getElementById('flash');
    f.textContent = msg; f.style.display = 'block';
    clearTimeout(flash._t);
    flash._t = setTimeout(function () { f.style.display = 'none'; }, 2200);
  }
  sheet.addEventListener('click', function (ev) {
    var t = ev.target;
    if (pop.contains(t)) return;
    if (!(t instanceof SVGRectElement) || !t.hasAttribute('data-id')) { pop.style.display = 'none'; return; }
    var st = loadState();
    var it = st.items.filter(function (i) { return i.id === t.getAttribute('data-id'); })[0];
    if (!it) return;
    if (it.locked) { flash('🔒 ' + (it.name || it.id).toUpperCase() + ' IS LOCKED — UNLOCK IT IN THE ELEVATION PLANNER'); return; }
    if (!live) { flash('OPEN THE ELEVATION PLANNER ONCE TO SEED THE WORKING DESIGN, THEN EDIT HERE'); return; }
    editingId = it.id;
    document.getElementById('popTitle').textContent = (it.name || it.id) + ' — footprint';
    document.getElementById('popX').value = it.wall === 'end' ? (it.d || 0) : it.x;
    document.getElementById('popW').value = it.w;
    document.getElementById('popDep').value = it.dep || 1;
    var rect = t.getBoundingClientRect(), host = sheet.getBoundingClientRect();
    pop.style.left = Math.min(rect.right - host.left + 10, host.width - 240) + 'px';
    pop.style.top = Math.max(8, rect.top - host.top - 10 + sheet.scrollTop) + 'px';
    pop.style.display = 'block';
  });
  document.getElementById('popCancel').addEventListener('click', function () { pop.style.display = 'none'; });
  document.getElementById('popSave').addEventListener('click', function () {
    if (!editingId) return;
    var raw;
    try { raw = JSON.parse(localStorage.getItem(WORK_KEY) || 'null'); } catch (e) { raw = null; }
    if (!raw || !raw.items) { flash('NO WORKING DESIGN TO EDIT'); pop.style.display = 'none'; return; }
    var nx = Number(document.getElementById('popX').value);
    var nw = Number(document.getElementById('popW').value);
    var nd = Number(document.getElementById('popDep').value);
    raw.items = raw.items.map(function (i) {
      if (i.id !== editingId || i.locked) return i;
      var n = Object.assign({}, i);
      if (i.wall === 'end') n.d = nx; else n.x = nx;
      if (nw > 0) n.w = nw;
      if (nd > 0) n.dep = nd;
      return n;
    });
    try { localStorage.setItem(WORK_KEY, JSON.stringify(raw)); } catch (e) { /* quota */ }
    pop.style.display = 'none';
    render();
    flash('SAVED — PLANNER AND 3D FOLLOW THE WORKING DESIGN');
  });

  render();
  window.addEventListener('storage', function (ev) {
    if (ev.key === WORK_KEY) { pop.style.display = 'none'; render(); }
  });
})();
</script>
</body>
</html>
