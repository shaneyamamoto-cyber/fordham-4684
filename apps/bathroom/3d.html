<script type="module">
import * as THREE from 'three';

const IN = 0.0254;

// Canonical baseline lives in ./baseline.js (shared with the elevation
// planner + floor plan) so promoting the baseline into the work slot from
// any view is lossless.
const FALLBACK = window.BATHROOM_BASELINE;

// deep-clone the baseline so editing the live design never mutates the shared
// window.BATHROOM_BASELINE (which would corrupt the built-in default + undo)
const CLONE = (o) => JSON.parse(JSON.stringify(o));
// Permanent design changes (2026-08-13): the metal finish throughout is a warm
// BRUSHED GOLD, and the paired vanity sconces are removed. Applied as a
// migration so existing saved work slots and locked versions pick the changes
// up on load — including any that a prior rose-gold pass had turned pink.
const BRUSHED_GOLD = '#c9a35c', PINK_ROSE = '#b76e79';
function migrateDesign(d) {
  if (d && Array.isArray(d.items)) {
    d.items = d.items.filter((i) => i && i.id !== 'light' && i.id !== 'light2');
    d.items.forEach((i) => {
      if (i.swatch && String(i.swatch).toLowerCase() === PINK_ROSE) i.swatch = BRUSHED_GOLD;
      if (i.tone && String(i.tone).toLowerCase() === PINK_ROSE) i.tone = BRUSHED_GOLD;
    });
  }
  if (d && (d.trimTone === 'rose' || d.trimTone === 'copper')) d.trimTone = 'gold';
  return d;
}
function loadLayout() {
  try {
    // LIVE-FIRST: the planner autosaves every edit (items, surf fills, shell)
    // to the work slot, so the 3D follows the working design directly — no
    // lock-and-reload ceremony. Locked versions remain available as fixed
    // snapshots via LOAD PLAN JSON / the versions slot below.
    const w = localStorage.getItem('yamazina.bathroom.work.v1');
    if (w) {
      const d = JSON.parse(w);
      if (d && d.items && d.items.length) {
        return { data: migrateDesign(Object.assign(CLONE(FALLBACK), d)), name: 'working design — live',
          note: 'follows the planner as you edit' };
      }
    }
    const raw = localStorage.getItem('yamazina.bathroom.versions.v1');
    if (!raw) return { data: migrateDesign(CLONE(FALLBACK)), name: 'built-in plan', note: 'no saved version found' };
    const d = JSON.parse(raw);
    const vs = d.versions || [];
    if (!vs.length) return { data: migrateDesign(CLONE(FALLBACK)), name: 'built-in plan', note: 'planner has no locked versions yet' };
    const pick = vs.filter(v => v.name === d.current)[0] || vs.slice().sort((a, b) => b.ts - a.ts)[0];
    return { data: migrateDesign(Object.assign(CLONE(FALLBACK), pick.data)), name: pick.name,
      note: 'locked ' + new Date(pick.ts).toLocaleString() };
  } catch (e) {
    return { data: migrateDesign(CLONE(FALLBACK)), name: 'built-in plan', note: 'could not read saved versions' };
  }
}

document.getElementById('loadPlanBtn').addEventListener('click', () => document.getElementById('planFile').click());
document.getElementById('planFile').addEventListener('change', (ev) => {
  const f = ev.target.files && ev.target.files[0];
  if (!f) return;
  f.text().then((txt) => {
    JSON.parse(txt); // validate before storing
    localStorage.setItem('yamazina.bathroom.versions.v1', txt);
    location.reload();
  }).catch(() => alert('Not a valid plan JSON export.'));
});

// Live sync: any planner edit (work slot) or new lock re-renders this view.
window.addEventListener('storage', (ev) => {
  if (ev.key === 'yamazina.bathroom.work.v1' || ev.key === 'yamazina.bathroom.versions.v1' || ev.key === 'yamazina.bathroom.fixtures.v1') {
    clearTimeout(window.__liveReloadT);
    window.__liveReloadT = setTimeout(() => location.reload(), 900);
  }
});

const L = loadLayout();
const S = L.data;

// Fixture Options are applied INTO the shared design by the Fixture Options
// picker (see fixtures.html + fixture-map.js), so every view renders the same
// thing and manual edits are never clobbered by a per-load overlay.
document.getElementById('srcName').textContent = L.name;

const SF = S.surf || {};

const RUN_BASE = { bay_back:'bay', step_return:'bay', vanity:'wall', end_left:'wall', end_right:'wall' };
const sc = function (k, dflt) {
  const e = SF[k] || SF[RUN_BASE[k]];
  return (e && e.color) ? new THREE.Color(e.color).getHex() : dflt;
};

  stone:    new THREE.MeshStandardMaterial({ name: 'stonetile',color: sc('bay', 0x9aa79b), roughness: 0.55, metalness: 0.03, side: THREE.FrontSide }),

  plaster:  new THREE.MeshStandardMaterial({ name: 'plaster',  color: sc('wall', 0xe8e3d8), roughness: 0.92, metalness: 0.0, side: THREE.FrontSide }),
  white:    new THREE.MeshStandardMaterial({ name: 'white',    color: 0xf7f6f2, roughness: 0.28, metalness: 0.02 }),
  brass:    new THREE.MeshStandardMaterial({ name: 'brass',    color: 0xc9a35c, roughness: 0.32, metalness: 0.38 }),
  trim:     new THREE.MeshStandardMaterial({ name: 'trim',     color: S.trimTone === 'gold' ? 0xc9a35c : S.trimTone === 'rose' ? 0xb76e79 : S.trimTone === 'copper' ? 0xb87a55 : 0x7d6552, roughness: 0.35, metalness: 0.38 }),
  glass:    new THREE.MeshPhysicalMaterial({ name: 'glass',    color: 0xcfe0e3, roughness: 0.08, metalness: 0.0, transmission: 0.35, transparent: true, opacity: 0.62, thickness: 0.02 }),
  solid:    new THREE.MeshStandardMaterial({ name: 'solidsurface', color: 0xe6e0d4, roughness: 0.4, metalness: 0.02 }),
  litvoid:  new THREE.MeshStandardMaterial({ name: 'litniche', color: 0xffd9a0, roughness: 0.5, metalness: 0.0, emissive: 0xffb765, emissiveIntensity: 0.85 }),
  slope:    new THREE.MeshStandardMaterial({ name: 'dormer',   color: sc('slope', 0xe8e3d8), roughness: 0.88, metalness: 0.0, side: THREE.FrontSide }),
  bayback:  new THREE.MeshStandardMaterial({ name: 'baybacktile', color: sc('bay_back', 0x9aa79b), roughness: 0.55, metalness: 0.03, side: THREE.FrontSide }),
  // the wall beside the shower, behind the floating shelves — its OWN zone so
  // it can carry a different finish from the shower tile (matches the 2D)
  shelfwall: new THREE.MeshStandardMaterial({ name: 'shelfwalltile', color: sc('shelf_wall', 0xe8e3d8), roughness: 0.72, metalness: 0.02, side: THREE.FrontSide }),
  steppier: new THREE.MeshStandardMaterial({ name: 'steppiertile', color: sc('step_return', 0x9aa79b), roughness: 0.55, metalness: 0.03 }),
  vanity:   new THREE.MeshStandardMaterial({ name: 'vanitywall', color: sc('vanity', 0xe8e3d8), roughness: 0.7, metalness: 0.02, side: THREE.FrontSide }),
  endL:     new THREE.MeshStandardMaterial({ name: 'endwallL',  color: sc('end_left', 0xe8e3d8), roughness: 0.92, metalness: 0.0, side: THREE.FrontSide }),
  endR:     new THREE.MeshStandardMaterial({ name: 'endwallR',  color: sc('end_right', 0xe8e3d8), roughness: 0.92, metalness: 0.0, side: THREE.FrontSide }),
  splashm:  new THREE.MeshStandardMaterial({ name: 'splashtile', color: sc('splash', 0xc8cec4), roughness: 0.55, metalness: 0.03 }),
  // modern white alcove tub — acrylic apron, NOT a tiled surround (name is
  // deliberately outside the tile-dressing map so it never gets tiled)
  skirt:    new THREE.MeshStandardMaterial({ name: 'tubacrylic', color: 0xf4f2ee, roughness: 0.3, metalness: 0.02 }),
  teak:     new THREE.MeshStandardMaterial({ name: 'teak', color: 0xb98b53, roughness: 0.5, metalness: 0.04 }),
  // painted trim — the planner spec calls the door, casing and baseboard
  // PAINTED white (#f1efe9-ish), not wood; without an explicit entry they
  // were falling into the walnut fallback
  paintTrim: new THREE.MeshStandardMaterial({ name: 'painttrim', color: 0xf1efe9, roughness: 0.6, metalness: 0.0 })
};

// ---- Photographic surfaces from the shared Look Book library ----
// Every tiled/stone/wood mesh gets its OWN material clone with texture
// repeats computed from that mesh's real dimensions, so a 15" pier and a
// 60" shower wall both show tile at true physical scale (this is what fixes
// the zoomed/stretched look a shared repeat gives). PBR maps ride along:
// generated normals for tile grout/relief, real rough/normal sets for wood.
const DEFAULT_SURF = {
  bay:    { fin: 'tile',  color: '#9aa79b', tileL: 48, tileW: 24, shape: 'rect', pattern: 'offset2' },
  splash: { fin: 'stone', color: '#4a5442', tileL: 60, tileW: 45, shape: 'rect', pattern: 'stack' },
  floor:  { fin: 'stone', color: '#bdb5a6', tileL: 24, tileW: 24, shape: 'rect', pattern: 'offset2' },
  skirt:  { fin: 'acrylic', color: '#f4f2ee', tileL: 24, tileW: 24, shape: 'rect', pattern: 'stack' },
  // the shelf wall defaults to plain paint so the shower tile does NOT run
  // behind the floating shelves unless the user deliberately tiles it
  shelf_wall: { fin: 'paint', color: '#e8e3d8', tileL: 24, tileW: 12, shape: 'rect', pattern: 'stack' },
  // plain walls (vanity/end walls via RUN_BASE, the dormer) default to paint —
  // WITHOUT these, surfFor() fell through to the bay tile, so an unset wall
  // showed green tile and edits to it appeared to do nothing
  wall:   { fin: 'paint', color: '#e8e3d8', tileL: 24, tileW: 12, shape: 'rect', pattern: 'stack' },
  slope:  { fin: 'paint', color: '#e8e3d8', tileL: 24, tileW: 12, shape: 'rect', pattern: 'stack' },
};
function surfFor(k) {
  return SF[k] || SF[RUN_BASE[k]] || DEFAULT_SURF[k] || DEFAULT_SURF[RUN_BASE[k]] || DEFAULT_SURF.bay;
}
const texLoader = new THREE.TextureLoader();
const texCache = {};
function loadTex(path, srgb) {
  if (!path) return Promise.resolve(null);
  if (!texCache[path]) {
    const src = (window.__MATLIB_DATA && window.__MATLIB_DATA[path]) ? window.__MATLIB_DATA[path] : '../../' + path;
    texCache[path] = new Promise((res) => texLoader.load(src, (t) => {
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      if (srgb) t.colorSpace = THREE.SRGBColorSpace;
      t.anisotropy = 8;
      res(t);
    }, undefined, () => res(null)));
  }
  return texCache[path];
}
async function dressMesh(mesh, lib) {
  const size = new THREE.Box3().setFromObject(mesh).getSize(new THREE.Vector3());
  const flat = size.y / IN < 6; // floors/counters map their two horizontal extents
  const faceW = flat ? size.x / IN : Math.max(size.x, size.z) / IN;
  const faceH = flat ? size.z / IN : size.y / IN;
  const [map, nrm, rgh, bmp] = await Promise.all([
    loadTex(lib.file, true), loadTex(lib.normal), loadTex(lib.rough), loadTex(lib.bump),
  ]);
  if (!map) return;
  const rx = Math.max(faceW / lib.spanW, 0.05), ry = Math.max(faceH / lib.spanH, 0.05);
  const mk = (t) => { if (!t) return null; const c = t.clone(); c.repeat.set(rx, ry); c.needsUpdate = true; return c; };
  const mat = mesh.material.clone();
  mat.map = mk(map);
  if (nrm) { mat.normalMap = mk(nrm); mat.normalScale = new THREE.Vector2(0.55, 0.55); }
  if (rgh) {
    mat.roughnessMap = mk(rgh); mat.roughness = 1.0;
    // 4684 pack maps are glTF-packed ORM: R=occlusion, G=roughness,
    // B=metalness — the same texture serves all three samplers
    if (lib.orm) { mat.aoMap = mat.roughnessMap; mat.aoMapIntensity = 0.9;
                   mat.metalnessMap = mat.roughnessMap; mat.metalness = 1.0; }
  }
  if (bmp) { mat.bumpMap = mk(bmp); mat.bumpScale = 0.02; }
  mat.color.set(lib.tint || 0xffffff);
  mesh.material = mat;
}
/* ============================================================
   PROCEDURAL TILE / STONE SURFACES  (colour-true, matches the 2D)
   ------------------------------------------------------------
   The elevation planner draws every surface in the EXACT colour, tile
   size, pattern and grout you choose. The 3D must do the SAME or edits
   look like they "do nothing". So tiled + stone zones are drawn
   procedurally here, straight from the surf spec, at each mesh's real
   physical scale — the identical geometry the 2D uses (running bond,
   third-offset, herringbone, chevron, basketweave, hex, penny), so a
   colour/size/pattern/grout pick shows up in both views at once.

   Paint stays a flat colour (no texture). An explicit Look Book pick
   (surf.lib) still gets its photographic PBR texture — that is a
   deliberate override the user asked for, not a heuristic guess.
   ============================================================ */
const HEX2RGB = (h) => { h = String(h || '#999999').replace('#', '');
  if (h.length === 3) h = h.split('').map((c) => c + c).join('');
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; };
const _cl = (v) => Math.max(0, Math.min(255, Math.round(v)));
const _rgb = (a) => 'rgb(' + a[0] + ',' + a[1] + ',' + a[2] + ')';
const _shade = (a, d) => 'rgb(' + _cl(a[0] + d) + ',' + _cl(a[1] + d) + ',' + _cl(a[2] + d) + ')';
const _hash = (n) => { const x = Math.sin(n * 127.1 + 11.7) * 43758.5453; return x - Math.floor(x); };
// tileL is the HORIZONTAL module, tileW the vertical — same convention as the 2D
const PROC_LAYS = { stack: { off: [0], rot: 0 }, offset2: { off: [0, 0.5], rot: 0 },
  offset3: { off: [0, 1 / 3, 2 / 3], rot: 0 }, vstack: { off: [0], rot: 90 } };
function procRects(SW, SH, tw, th, pattern) {
  const out = [];
  if (pattern === 'herring') { const hh = Math.min(tw, th), ww = hh * 2, N = Math.ceil((SW + SH) / hh) + 4;
    for (let m = -N; m <= N; m++) for (let n = -N; n <= N; n++) {
      const ox = m * (ww + hh) + n * ww, oy = m * hh + n * ww;
      if (ox > SW + ww || oy > SH + ww || ox < -2 * ww || oy < -2 * ww) continue;
      out.push([ox + ww / 2, oy + hh / 2, ww, hh, 0]); out.push([ox + ww + hh / 2, oy + ww / 2, hh, ww, 0]); }
    return out; }
  if (pattern === 'basket') { const hh = Math.min(tw, th), ww = hh * 2, bc = Math.ceil(SW / ww) + 2, br = Math.ceil(SH / ww) + 2;
    for (let i = -1; i < bc; i++) for (let j = -1; j < br; j++) { const ox = i * ww, oy = j * ww;
      if ((i + j + 2) % 2 === 0) { out.push([ox + ww / 2, oy + hh / 2, ww, hh, 0]); out.push([ox + ww / 2, oy + hh * 1.5, ww, hh, 0]); }
      else { out.push([ox + hh / 2, oy + ww / 2, hh, ww, 0]); out.push([ox + hh * 1.5, oy + ww / 2, hh, ww, 0]); } }
    return out; }
  if (pattern === 'chevron') { const L = Math.max(tw, th), T = Math.min(tw, th), c45 = Math.cos(Math.PI / 4);
    const bw = L * c45, step = T / c45, bands = Math.ceil(SW / bw) + 2, per = Math.ceil(SH / step) + Math.ceil(bw / step) + 3;
    for (let c = -1; c < bands; c++) { const bx = c * bw, sign = (((c % 2) + 2) % 2) ? -1 : 1;
      for (let k = -2; k < per; k++) out.push([bx + bw / 2, k * step + (sign > 0 ? 0 : step / 2), L * 1.6, T, sign * Math.PI / 4, [bx, -L, bw, SH + 2 * L]]); }
    return out; }
  const lay = PROC_LAYS[pattern] || PROC_LAYS.stack;
  let w = tw, h = th; if (lay.rot === 90) { w = th; h = tw; }
  const offs = lay.off, rows = Math.ceil(SH / h) + 3, cols = Math.ceil(SW / w) + 3;
  for (let r = -2; r < rows; r++) { const dx = offs[((r % offs.length) + offs.length) % offs.length] * w;
    for (let c = -2; c < cols; c++) out.push([c * w + dx + w / 2, r * h + h / 2, w, h, 0]); }
  return out;
}
function procHex(SW, SH, size) { const w = size, r = w / Math.sqrt(3), vstep = 1.5 * r, out = [];
  const rowMax = Math.ceil((SH + 2 * r) / vstep) + 1, colMax = Math.ceil((SW + 2 * w) / w) + 1;
  for (let row = -1; row <= rowMax; row++) { const y = row * vstep, xoff = (((row % 2) + 2) % 2) ? w / 2 : 0;
    for (let col = -1; col <= colMax; col++) { const x = col * w + xoff, pts = [];
      for (let k = 0; k < 6; k++) { const a = Math.PI / 180 * (60 * k - 90); pts.push([x + r * Math.cos(a), y + r * Math.sin(a)]); }
      out.push(pts); } }
  return out;
}
function procTileTexture(surf, faceW, faceH) {
  const base = HEX2RGB(surf.color || '#9aa79b');
  const grout = surf.grout ? HEX2RGB(surf.grout) : [_cl(base[0] * 0.78), _cl(base[1] * 0.78), _cl(base[2] * 0.78)];
  const stone = surf.fin === 'stone';
  const tl = Math.max(2, surf.tileL || (stone ? 24 : 12)), tw = Math.max(2, surf.tileW || (stone ? 24 : 12));
  const pat = surf.pattern || 'stack', shp = surf.shape || 'rect';
  const tmin = Math.min(tl, tw), gw = Math.max(0.0625, Math.min(0.28, tmin / 26)), varAmt = stone ? 15 : 9;
  const ppi = Math.max(2.6, Math.min(12, 1100 / Math.max(faceW, faceH)));
  const cw = Math.max(8, Math.round(faceW * ppi)), ch = Math.max(8, Math.round(faceH * ppi));
  const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
  const g = cv.getContext('2d');
  g.setTransform(ppi, 0, 0, ppi, 0, 0);
  g.fillStyle = _rgb(grout); g.fillRect(0, 0, faceW, faceH);
  const sheen = stone ? 0.11 : 0.08;
  function finishPass(x, y, w, h) { const lg = g.createLinearGradient(x, y, x + w * 0.45, y + h);
    lg.addColorStop(0, 'rgba(255,255,255,' + sheen + ')'); lg.addColorStop(0.55, 'rgba(255,255,255,0)');
    lg.addColorStop(1, 'rgba(0,0,0,' + (sheen * 0.7) + ')'); g.fillStyle = lg; g.fillRect(x, y, w, h); }

// ---- fittings ----------------------------------------------------------
function rake(y) {
  if (S.slopeRun <= 0 || y <= S.kneeH) return 0;
  return Math.min(S.slopeRun, (y - S.kneeH) / Math.max(1, H - S.kneeH) * S.slopeRun);
}

  if (!base) base = it.id;
  let nm = base, k = 2;
  while (usedNames[nm]) nm = base + '_' + (k++);
  usedNames[nm] = 1;
  return nm;
}

        Object.assign(it, patch);
        const state = seedState();
        state.items = state.items.map((z) => z.id === fixDrag.id ? Object.assign({}, z, patch) : z);
        writeState(state);
        selId = fixDrag.id; renderSpec(); renderFix();
        toast('Moved ' + (it.name || fixDrag.id));
        fixDrag = null;
        if (controls) controls.enabled = true;
        return;
      }
      if (dn && !dn.moved) {
        const id = dn.pickId || (pick(e.clientX, e.clientY) || {}).id;
        if (id && byId[id]) { openEditor(id); toast('Editing ' + (byId[id].name || id)); }
        else {
          const zone = pickZone(e.clientX, e.clientY);   // clicked a wall/floor → material picker
          if (zone) { matZone = zone; try { sessionStorage.setItem('b-matzone', zone); } catch (er) {} setTab('mat'); renderMat();
            const lbl = (MAT_SURFACES.filter((s) => s[0] === zone)[0] || [, zone])[1];
            toast('Material · ' + lbl + ' — pick a tile/colour'); }
        }
      }
      dn = null;
    }
    cv.addEventListener('pointerup', end, true);
    cv.addEventListener('pointercancel', () => { if (fixDrag) { fixDrag = null; hideGuides(); if (controls) controls.enabled = true; } }, true);
  })();
  renderSpec(); renderFix(); renderMat();
})();

</script>
